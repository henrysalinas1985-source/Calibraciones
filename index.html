<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relevamiento de Equipos | Swiss Medical</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <div class="logo-section">
                <div class="logo-dots">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <h1>Panel de Equipos</h1>
            </div>
            <p style="color: #666;">Visualización estática de relevamiento 2025</p>
        </header>

        <div class="stats">
            <div class="stat-card" id="totalEquiposCard">
                <span class="value" id="totalEquipos">0</span>
                <span class="label">Total Equipos</span>
            </div>
            <div class="stat-card">
                <span class="value" id="totalTipos">0</span>
                <span class="label">Tipos Diferentes</span>
            </div>
            <div class="stat-card" style="border-color: #f39c12;" id="upcomingCalibrationsCard">
                <span class="value" id="upcomingCalibrations">0</span>
                <span class="label">Próximos Vencimientos</span>
            </div>
            <div class="stat-card" style="border-color: #2c3e50;">
                <span class="value">2025</span>
                <span class="label">Año de Relevamiento</span>
            </div>
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Buscar por serie o fecha...">
            <select id="classFilter">
                <option value="all">Todas las clases</option>
                <!-- Categories will be injected here -->
            </select>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Equipo</th>
                        <th>N° de Serie</th>
                        <th>Fecha de Relevamiento</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data will be injected here -->
                </tbody>
            </table>
        </div>

        <footer style="margin-top: 3rem; text-align: center; color: #999; font-size: 0.8rem;">
            &copy; 2025 Relevamiento Técnico - Swiss Medical Group
        </footer>
    </div>
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>

</html>
